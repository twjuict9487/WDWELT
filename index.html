<!doctype html>
<html lang="zh-Hant" data-theme="dark" data-font-size="medium">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#121212" />
    <style>
      html,
      body {
        background: #121212;
        color: #e6e6e6;
      }

      html[data-theme='light'],
      html[data-theme='light'] body {
        background: #f5f5f5;
        color: #1c1c1c;
      }
    </style>
    <script>
      (() => {
        const key = 'today-progress-g1:preferences:v1';
        let theme = 'dark';
        let fontSize = 'medium';
        try {
          const saved = JSON.parse(localStorage.getItem(key) || 'null');
          if (saved?.theme === 'dark' || saved?.theme === 'light') theme = saved.theme;
          if (saved?.fontSize === 'small' || saved?.fontSize === 'medium' || saved?.fontSize === 'large') fontSize = saved.fontSize;
        } catch {
          // Invalid preferences fall back to the dark, medium defaults.
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.fontSize = fontSize;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#121212' : '#f5f5f5');
      })();
    </script>
    <title>今天上到哪</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
